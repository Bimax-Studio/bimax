<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#FFE8E2" />
  <!-- Pattern a pallini sottili -->
  <circle cx="40" cy="40" r="3" fill="#D63914" opacity="0.2" />
  <circle cx="120" cy="40" r="3" fill="#D63914" opacity="0.2" />
  <circle cx="200" cy="40" r="3" fill="#D63914" opacity="0.2" />
  <circle cx="280" cy="40" r="3" fill="#D63914" opacity="0.2" />
  <circle cx="360" cy="40" r="3" fill="#D63914" opacity="0.2" />
  <circle cx="40" cy="120" r="3" fill="#D63914" opacity="0.2" />
  <circle cx="360" cy="120" r="3" fill="#D63914" opacity="0.2" />
  
  <!-- Corpo stilizzato -->
  <ellipse cx="200" cy="380" rx="140" ry="90" fill="#FFD027" stroke="#1A1A1A" stroke-width="6" />
  <!-- Colletto maglietta -->
  <path d="M165 310 Q200 335 235 310" stroke="#1A1A1A" stroke-width="5" fill="#FFFFFF" />

  <!-- Collo -->
  <rect x="175" y="240" width="50" height="75" rx="8" fill="#FAD4C0" stroke="#1A1A1A" stroke-width="6" />

  <!-- Testa -->
  <ellipse cx="200" cy="180" rx="80" ry="95" fill="#FAD4C0" stroke="#1A1A1A" stroke-width="6" />
  
  <!-- Capelli spettinati da sviluppatore -->
  <path d="M120 170 C110 110 150 70 200 70 C250 70 290 110 280 170 C270 120 250 95 200 95 C150 95 130 120 120 170 Z" fill="#1A1A1A" />
  
  <!-- Occhialoni nerd pop -->
  <rect x="140" y="150" width="50" height="40" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5" />
  <rect x="210" y="150" width="50" height="40" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5" />
  <path d="M190 170 H210" stroke="#1A1A1A" stroke-width="5" />
  <path d="M125 165 L140 170 M260 170 L275 165" stroke="#1A1A1A" stroke-width="5" />

  <!-- Occhi vispi -->
  <circle cx="165" cy="170" r="7" fill="#1A1A1A" />
  <circle cx="167" cy="168" r="2.5" fill="#FFFFFF" />
  <circle cx="235" cy="170" r="7" fill="#1A1A1A" />
  <circle cx="237" cy="168" r="2.5" fill="#FFFFFF" />

  <!-- Naso e sorriso ironico -->
  <path d="M197 195 Q203 205 198 208" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M180 225 Q200 240 220 220" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />
  
  <!-- Cuffie da lavoro -->
  <path d="M115 175 C105 125 145 60 200 60 C255 60 295 125 285 175" stroke="#D63914" stroke-width="12" stroke-linecap="round" fill="none" />
  <rect x="110" y="155" width="20" height="45" rx="8" fill="#1A1A1A" stroke="#D63914" stroke-width="4" />
  <rect x="270" y="155" width="20" height="45" rx="8" fill="#1A1A1A" stroke="#D63914" stroke-width="4" />
  
  <!-- Sticker iconico -->
  <g transform="translate(20, 20) rotate(-6)">
    <rect width="110" height="34" rx="8" fill="#FFD027" stroke="#1A1A1A" stroke-width="3" />
    <text x="55" y="22" font-family="monospace" font-size="13" font-weight="900" fill="#1A1A1A" text-anchor="middle">DEV & CODICE</text>
