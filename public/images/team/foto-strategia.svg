<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#DFF9F4" />
  <!-- Pattern a pallini sottili -->
  <circle cx="40" cy="40" r="3" fill="#00C9A7" opacity="0.3" />
  <circle cx="120" cy="40" r="3" fill="#00C9A7" opacity="0.3" />
  <circle cx="200" cy="40" r="3" fill="#00C9A7" opacity="0.3" />
  <circle cx="280" cy="40" r="3" fill="#00C9A7" opacity="0.3" />
  <circle cx="360" cy="40" r="3" fill="#00C9A7" opacity="0.3" />
  <circle cx="40" cy="120" r="3" fill="#00C9A7" opacity="0.3" />
  <circle cx="360" cy="120" r="3" fill="#00C9A7" opacity="0.3" />

  <!-- Corpo stilizzato felpa menta / scura -->
  <ellipse cx="200" cy="380" rx="140" ry="90" fill="#00C9A7" stroke="#1A1A1A" stroke-width="6" />
  <path d="M165 310 Q200 335 235 310" stroke="#1A1A1A" stroke-width="5" fill="#FFFFFF" />

  <!-- Collo -->
  <rect x="175" y="240" width="50" height="75" rx="8" fill="#FAD4C0" stroke="#1A1A1A" stroke-width="6" />

  <!-- Testa -->
  <ellipse cx="200" cy="180" rx="80" ry="95" fill="#FAD4C0" stroke="#1A1A1A" stroke-width="6" />
  
  <!-- Berretto da baseball pop -->
  <path d="M115 150 C115 100 150 70 200 70 C250 70 285 100 285 150 Z" fill="#D63914" stroke="#1A1A1A" stroke-width="6" />
  <!-- Visiera girata di lato con carattere -->
  <path d="M190 120 C240 105 295 110 320 135 C300 150 250 145 190 130 Z" fill="#FFD027" stroke="#1A1A1A" stroke-width="5" />
  <circle cx="200" cy="70" r="6" fill="#1A1A1A" />

  <!-- Occhi vispi e amichevoli -->
  <circle cx="165" cy="175" r="7" fill="#1A1A1A" />
  <circle cx="167" cy="173" r="2.5" fill="#FFFFFF" />
  <circle cx="235" cy="175" r="7" fill="#1A1A1A" />
  <circle cx="237" cy="173" r="2.5" fill="#FFFFFF" />

  <!-- Sopracciglia espressive -->
  <path d="M150 160 Q165 150 180 158" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M220 158 Q235 150 250 160" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Naso e sorriso rassicurante -->
  <path d="M197 195 Q203 205 198 208" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M175 220 Q200 240 225 220" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />
  
  <!-- Pin o spilletta Google Maps sulla felpa -->
  <g transform="translate(140, 330)">
    <circle cx="15" cy="15" r="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" />
    <path d="M15 6 C11 6 8 9 8 13 C8 18 15 24 15 24 C15 24 22 18 22 13 C22 9 19 6 15 6 Z" fill="#D63914" />
    <circle cx="15" cy="12" r="3" fill="#FFFFFF" />
  </g>

  <!-- Sticker iconico -->
  <g transform="translate(20, 20) rotate(5)">
    <rect width="135" height="34" rx="8" fill="#FFD027" stroke="#1A1A1A" stroke-width="3" />
    <text x="67" y="22" font-family="monospace" font-size="12" font-weight="900" fill="#1A1A1A" text-anchor="middle">STRATEGIA & MAPS</text>
  </g>
</svg>
